spring.application.name=ticket-booking-api

# Schema is generated from the entities while the model is still changing.
# TODO (week 3): switch to Flyway migrations and set ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# How long a seat stays reserved before a scheduled job releases it again (custom property)
seat.hold.duration=PT10M

management.endpoints.web.exposure.include=health,info

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true